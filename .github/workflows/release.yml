name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
            conventional-changelog-conventionalcommits

      - name: Update Cargo.toml version
        if: steps.semantic.outputs.new_release_published == 'true'
        env:
          RELEASE_VERSION: ${{ steps.semantic.outputs.new_release_version }}
        run: |
          sed -i "s/^version = \".*\"/version = \"${RELEASE_VERSION}\"/" Cargo.toml
          cargo check --quiet
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add Cargo.toml Cargo.lock
          git commit -m "chore(release): update Cargo.toml to v${RELEASE_VERSION} [skip ci]"
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:main

  crates:
    name: Publish to Crates.io
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Pull latest changes
        run: git pull origin main

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Verify Cargo.toml version
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.new_release_version }}
        run: |
          CARGO_VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          echo "Expected version: $RELEASE_VERSION"
          echo "Cargo.toml version: $CARGO_VERSION"
          if [ "$RELEASE_VERSION" != "$CARGO_VERSION" ]; then
            echo "Version mismatch! Updating Cargo.toml..."
            sed -i "s/^version = \".*\"/version = \"${RELEASE_VERSION}\"/" Cargo.toml
            cargo check --quiet
          fi

      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CARGO_CRATES_TOKEN }} --allow-dirty

  build-binaries:
    name: Build ${{ matrix.artifact_name }}
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact_name: soketi-rs-linux-amd64
            archive: tar.gz
            use_cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            artifact_name: soketi-rs-linux-arm64
            archive: tar.gz
            use_cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: soketi-rs-darwin-amd64
            archive: tar.gz
            use_cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: soketi-rs-darwin-arm64
            archive: tar.gz
            use_cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: soketi-rs-windows-amd64
            archive: zip
            use_cross: false
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            artifact_name: soketi-rs-windows-arm64
            archive: zip
            use_cross: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Pull latest changes
        shell: bash
        run: git pull origin main

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Install cross (Linux musl)
        if: matrix.use_cross == true
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (cross - Linux musl)
        if: matrix.use_cross == true
        run: cross build --release --target ${{ matrix.target }} --locked

      - name: Build (native)
        if: matrix.use_cross == false
        run: cargo build --release --target ${{ matrix.target }} --locked

      - name: Package tar.gz
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p "${{ matrix.artifact_name }}"
          cp "target/${{ matrix.target }}/release/soketi-rs" "${{ matrix.artifact_name }}/soketi-rs"
          tar -czf "${{ matrix.artifact_name }}.tar.gz" "${{ matrix.artifact_name }}"

      - name: Package zip (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ matrix.artifact_name }}"
          Copy-Item "target/${{ matrix.target }}/release/soketi-rs.exe" "${{ matrix.artifact_name }}/"
          Compress-Archive -Path "${{ matrix.artifact_name }}" -DestinationPath "${{ matrix.artifact_name }}.zip"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release.outputs.new_release_version }}
          files: ${{ matrix.artifact_name }}.${{ matrix.archive }}

  checksums:
    name: Generate SHA256SUMS
    needs: [release, build-binaries]
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ needs.release.outputs.new_release_version }}
        run: |
          gh release download "v${RELEASE_VERSION}" \
            --repo "${{ github.repository }}" \
            --dir ./artifacts \
            --pattern "*.tar.gz" \
            --pattern "*.zip"

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload SHA256SUMS to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release.outputs.new_release_version }}
          files: artifacts/SHA256SUMS

  docker:
    name: Build and Push Docker Image
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: v${{ needs.release.outputs.new_release_version }}
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: funal
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extract version tags
        id: version
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.new_release_version }}
        run: |
          MAJOR_MINOR=$(echo "$RELEASE_VERSION" | cut -d. -f1-2)
          MAJOR=$(echo "$RELEASE_VERSION" | cut -d. -f1)
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "major_minor=$MAJOR_MINOR" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deployment/docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            funal/soketi-rs:${{ steps.version.outputs.version }}
            funal/soketi-rs:${{ steps.version.outputs.major_minor }}
            funal/soketi-rs:${{ steps.version.outputs.major }}
            funal/soketi-rs:latest
          cache-from: type=gha,scope=release-multi-arch
          cache-to: type=gha,mode=max,scope=release-multi-arch

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: funal
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
          repository: funal/soketi-rs
          readme-filepath: ./DOCKER_HUB_README.md
