services:
  # Soketi WebSocket Server
  soketi:
    image: ${SOKETI_IMAGE:-funal/soketi-rs:latest}
    restart: unless-stopped
    expose:
      - "6001"  # WebSocket/API port, internal only
      - "9601"  # Metrics port, internal only
    volumes:
      - ${PUSHER_CONFIG_PATH:-./config.example.json}:/app/config.json:ro
    environment:
      - PUSHER_HOST=${PUSHER_HOST:-0.0.0.0}
      - PUSHER_PORT=${PUSHER_PORT:-6001}
      - PUSHER_METRICS_PORT=${PUSHER_METRICS_PORT:-9601}
      - PUSHER_DEBUG=${PUSHER_DEBUG:-false}
      - PUSHER_DEFAULT_APP_ID=${PUSHER_DEFAULT_APP_ID:-app-id}
      - PUSHER_DEFAULT_APP_KEY=${PUSHER_DEFAULT_APP_KEY:-app-key}
      - PUSHER_DEFAULT_APP_SECRET=${PUSHER_DEFAULT_APP_SECRET:-change-me}
    networks:
      - soketi-network
    healthcheck:
      test: ["CMD", "/usr/local/bin/wget", "-qO", "/dev/null", "http://localhost:6001/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Caddy Reverse Proxy
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"      # HTTP
      - "${HTTPS_PORT:-443}:443"    # HTTPS (HTTP/2)
      - "${HTTP3_PORT:-443}:443/udp" # HTTP/3 (QUIC)
    volumes:
      # Mount Caddyfile
      - ${CADDYFILE_PATH:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      # Persistent storage for Caddy data (certificates, etc.)
      - caddy_data:/data
      - caddy_config:/config
      # Optional: Mount custom SSL certificates
      # - ${SSL_CERTS_PATH:-./certs}:/etc/caddy/certs:ro
    environment:
      # Caddy configuration
      - DOMAIN=${DOMAIN:-soketi.example.com}
    networks:
      - soketi-network
    depends_on:
      soketi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

networks:
  soketi-network:
    driver: bridge
    ipam:
      config:
        - subnet: ${SOKETI_NETWORK_SUBNET:-172.20.0.0/16}

volumes:
  caddy_data:
    driver: local
  caddy_config:
    driver: local
