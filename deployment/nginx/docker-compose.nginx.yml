services:
  # Soketi WebSocket Server
  soketi:
    image: ${SOKETI_IMAGE:-funal/soketi-rs:latest}
    restart: unless-stopped
    expose:
      - "6001"  # WebSocket/API port, internal only
      - "9601"  # Metrics port, internal only
    volumes:
      - ${PUSHER_CONFIG_PATH:-./config.example.json}:/app/config.json:ro
    environment:
      - PUSHER_HOST=${PUSHER_HOST:-0.0.0.0}
      - PUSHER_PORT=${PUSHER_PORT:-6001}
      - PUSHER_METRICS_PORT=${PUSHER_METRICS_PORT:-9601}
      - PUSHER_DEBUG=${PUSHER_DEBUG:-false}
      - PUSHER_DEFAULT_APP_ID=${PUSHER_DEFAULT_APP_ID:-app-id}
      - PUSHER_DEFAULT_APP_KEY=${PUSHER_DEFAULT_APP_KEY:-app-key}
      - PUSHER_DEFAULT_APP_SECRET=${PUSHER_DEFAULT_APP_SECRET:-change-me}
    networks:
      - soketi-network
    healthcheck:
      test: ["CMD", "/usr/local/bin/wget", "-qO", "/dev/null", "http://localhost:6001/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # Nginx Reverse Proxy
  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"        # HTTP
      - "${HTTPS_PORT:-443}:443"     # HTTPS (HTTP/2)
    volumes:
      # Mount Nginx configuration files
      - ${NGINX_CONF_PATH:-./nginx.conf}:/etc/nginx/nginx.conf:ro
      - ${NGINX_DEFAULT_CONF_PATH:-./default.conf}:/etc/nginx/conf.d/default.conf:ro
      # Mount SSL/TLS certificates
      - ${SSL_CERT_PATH:-./certs/cert.pem}:/etc/nginx/ssl/cert.pem:ro
      - ${SSL_KEY_PATH:-./certs/key.pem}:/etc/nginx/ssl/key.pem:ro
      # Optional: Mount additional SSL certificates or CA bundle
      # - ${SSL_CA_PATH:-./certs/ca.pem}:/etc/nginx/ssl/ca.pem:ro
      # Persistent storage for Nginx logs
      - nginx_logs:/var/log/nginx
      # Optional: Mount custom error pages
      # - ${NGINX_ERROR_PAGES:-./error-pages}:/usr/share/nginx/html/errors:ro
    networks:
      - soketi-network
    depends_on:
      soketi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run

networks:
  soketi-network:
    driver: bridge
    ipam:
      config:
        - subnet: ${SOKETI_NETWORK_SUBNET:-172.20.0.0/16}

volumes:
  nginx_logs:
    driver: local
